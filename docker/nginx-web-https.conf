# Igual que nginx-web.conf pero con https, que el navegador del celular exige para grabar con el micrófono.
# Lo activa docker-compose.https.yml con el certificado de `python -m scripts.generar_certificado` (carpeta certs/).
# Es una plantilla: la imagen de nginx reemplaza ${PUERTO_HTTPS} (el puerto publicado) al arrancar y deja $host y los demás intactos.
server {
    listen 80;
    return 301 https://$host:${PUERTO_HTTPS}$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    root /usr/share/nginx/html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        # La dirección real de quien pide, que el backend usa para el límite de intentos y para saber si es de la red
        # del colegio. Se sobrescribe siempre: nunca viaja la que mande el cliente.
        proxy_set_header X-IP-Cliente $remote_addr;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
