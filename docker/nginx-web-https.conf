# Igual que nginx-web.conf pero con https, que el navegador del celular exige para grabar con el micrófono.
# Lo activa docker-compose.https.yml con el certificado de `python -m scripts.generar_certificado` (carpeta certs/).
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    root /usr/share/nginx/html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
