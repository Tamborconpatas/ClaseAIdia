server {
    listen 80;
    root /usr/share/nginx/html;

    # Trozos de audio (hasta 8 MB) y fotos de la pizarra (hasta 15 MB); el backend aplica sus propios topes.
    client_max_body_size 20m;

    # El frontend llama a /api/...; el backend no lleva ese prefijo (igual que el proxy de `npm run dev`).
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        # La dirección real de quien pide, que el backend usa para el límite de intentos y para saber si es de la red
        # del colegio. Se sobrescribe siempre: nunca viaja la que mande el cliente.
        proxy_set_header X-IP-Cliente $remote_addr;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
