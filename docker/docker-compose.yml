# Nombre fijo: si no, Compose lo deriva del nombre de esta carpeta ("docker")
# y los contenedores/volúmenes existentes (con el modelo ya descargado)
# quedarían huérfanos.
name: transcriptor

services:
  # Interfaz (React compilado) servida por nginx, que reenvía /api al backend. Es lo único que se publica.
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "${PUERTO_WEB:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

  # Backend: API FastAPI y trabajador de procesamiento (Whisper + Ollama). Lee el mismo .env que la instalación
  # sin Docker (JWT_SECRET_KEY, MODELO_WHISPER, PROCESAMIENTOS_SIMULTANEOS...); lo de abajo ajusta rutas y red.
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Para que los archivos de ../datos queden a nombre de tu usuario y no de root. Ajusta APP_UID/GID si tu
    # usuario no es el 1000 por defecto (`id -u` / `id -g`).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite:////data/escuela.db
      - CARPETA_RESPALDOS=/data/respaldos
      - AUDIO_TEMP_DIR=/data/audio_temp
      - FOTOS_TEMP_DIR=/data/fotos_temp
      - OLLAMA_URL=http://ollama-lb:11434
    volumes:
      # Base de datos, respaldos, audio temporal y modelos de Whisper. Crea la carpeta antes (`mkdir datos`) para que
      # no la cree Docker como root.
      - ../datos:/data
    depends_on:
      - ollama-lb
    restart: unless-stopped

  # Cluster local (misma máquina, no distribuido). Ajusta réplicas
  # agregando/quitando bloques ollama-N + la línea en nginx-ollama.conf,
  # según la RAM disponible.
  ollama-1:
    image: ollama/ollama:latest
    volumes:
      - ollama_data_1:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 3 && ollama pull \"$$OLLAMA_MODEL\"; wait"]
    restart: unless-stopped

  ollama-2:
    image: ollama/ollama:latest
    volumes:
      - ollama_data_2:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 3 && ollama pull \"$$OLLAMA_MODEL\"; wait"]
    restart: unless-stopped

  ollama-lb:
    image: nginx:alpine
    volumes:
      - ./nginx-ollama.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ollama-1
      - ollama-2
    restart: unless-stopped

volumes:
  ollama_data_1:
  ollama_data_2:
