# Nombre fijo: si no, Compose lo deriva del nombre de esta carpeta ("docker")
# y los contenedores/volúmenes existentes (con el modelo ya descargado)
# quedarían huérfanos.
name: transcriptor

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Sin esto el contenedor escribe outputs/downloads/db como root — y si
    # después se corre la app nativa (sin Docker) como usuario normal, esos
    # archivos quedan inaccesibles (Permission denied). Ajusta APP_UID/GID
    # si tu usuario no es el 1000 por defecto (`id -u` / `id -g`).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "7862:7862"
    environment:
      - SERVER_NAME=0.0.0.0
      - SERVER_PORT=7862
      - OLLAMA_URL=http://ollama-lb:11434
    volumes:
      - ../outputs:/app/outputs
      - ../downloads:/app/downloads
      - ../transcriptions_history.db:/app/transcriptions_history.db
      - ../transcriber_config.json:/app/transcriber_config.json
    depends_on:
      - ollama-lb
    restart: unless-stopped

  # Cluster local (misma máquina, no distribuido). Ajusta réplicas
  # agregando/quitando bloques ollama-N + la línea en nginx-ollama.conf,
  # según la RAM disponible.
  ollama-1:
    image: ollama/ollama:latest
    volumes:
      - ollama_data_1:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 3 && ollama pull \"$$OLLAMA_MODEL\"; wait"]
    restart: unless-stopped

  ollama-2:
    image: ollama/ollama:latest
    volumes:
      - ollama_data_2:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 3 && ollama pull \"$$OLLAMA_MODEL\"; wait"]
    restart: unless-stopped

  ollama-lb:
    image: nginx:alpine
    volumes:
      - ./nginx-ollama.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ollama-1
      - ollama-2
    restart: unless-stopped

volumes:
  ollama_data_1:
  ollama_data_2:
