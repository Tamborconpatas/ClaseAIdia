worker_processes 1;

events {
    worker_connections 128;
}

http {
    upstream ollama_backends {
        server ollama-1:11434;
        server ollama-2:11434;
    }

    server {
        listen 11434;

        # >= al timeout de infraestructura/cliente_ollama.py (600s) — el
        # default de nginx (60s) cortaría generaciones largas antes de tiempo.
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        location / {
            proxy_pass http://ollama_backends;
        }
    }
}
